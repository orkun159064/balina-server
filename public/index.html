<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balina Alarm - Whale Trading Dashboard</title>
    <meta name="description" content="Balina Alarm - XAUUSD ve BTCUSDT için gerçek zamanlı balina hareket takip ve alarm sistemi. Teyit amaçlı sinyal platformu.">
    <meta name="keywords" content="forex, sinyal, balina, xauusd, btcusdt, trading, kripto, altın">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0e17;--bg2:#111827;--bg3:#1a2332;--bg4:#243044;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--blue:#3b82f6;--blue-hover:#2563eb;--blue-glow:rgba(59,130,246,.3);--green:#10b981;--green-bg:rgba(16,185,129,.12);--red:#ef4444;--red-bg:rgba(239,68,68,.12);--yellow:#f59e0b;--yellow-bg:rgba(245,158,11,.12);--yellow-bdr:rgba(245,158,11,.3);--orange:#f97316;--orange-bg:rgba(249,115,22,.12);--orange-bdr:rgba(249,115,22,.3);--r:12px;--rs:8px;--rl:16px;--shadow:0 4px 6px -1px rgba(0,0,0,.3);--t:all .3s ease}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes swim{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.3)}50%{box-shadow:0 0 40px rgba(59,130,246,.6)}}
        @keyframes flashNavGreen{0%,100%{background:var(--bg3)}50%{background:#00cc66}}
        @keyframes flashNavRed{0%,100%{background:var(--bg3)}50%{background:#cc0000}}
        .nav.flash-green{animation:flashNavGreen .4s ease 8}
        .nav.flash-red{animation:flashNavRed .4s ease 8}
        @keyframes borderPulseGreen{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 80px rgba(16,185,129,.15)}}
        @keyframes borderPulseRed{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 80px rgba(239,68,68,.15)}}
        body.flash-border-green{animation:borderPulseGreen .5s ease 6}
        body.flash-border-red{animation:borderPulseRed .5s ease 6}
        .flash-bar{display:none;position:fixed;top:60px;left:0;right:0;height:6px;z-index:98}
        .flash-bar.al{display:block;background:linear-gradient(90deg,#00ff88,#10b981,#00ff88);animation:pulse .3s ease 10}
        .flash-bar.as{display:block;background:linear-gradient(90deg,#ff4444,#ef4444,#ff4444);animation:pulse .3s ease 10}
        /* LOADING */
        .loading-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .5s}
        .loading-screen.hide{opacity:0;pointer-events:none}
        .loading-whale{font-size:64px;animation:swim 2s ease infinite}
        .loading-bar{width:200px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
        .loading-bar-inner{width:0%;height:100%;background:var(--blue);border-radius:2px;animation:loadBar 2s ease forwards}
        @keyframes loadBar{0%{width:0%}100%{width:100%}}
        .loading-text{color:var(--text3);font-size:13px}
        /* LANDING */
        .landing{min-height:100vh;background:linear-gradient(135deg,#0a0e17,#0d1b2a,#111827);position:relative;overflow:hidden}
        .landing::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 50%,rgba(59,130,246,.03) 0%,transparent 50%);animation:rotate 30s linear infinite;pointer-events:none}
        @keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .landing-top{position:sticky;top:0;z-index:100;background:var(--bg3);border-bottom:1px solid var(--bg4);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
        .landing-top-logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px}
        .landing-top-logo span{font-size:20px}
        .landing-online{display:flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:16px;font-size:11px;font-weight:600;color:var(--green)}
        .landing-online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite}
        .landing-hero{max-width:700px;margin:0 auto;padding:60px 24px 40px;text-align:center;position:relative;z-index:1}
        .landing-whale{font-size:80px;display:block;margin-bottom:16px;animation:swim 3s ease infinite}
        .landing-title{font-size:38px;font-weight:900;color:#fff;margin-bottom:12px;letter-spacing:-1px}
        .landing-sub{font-size:16px;color:var(--text3);margin-bottom:36px;line-height:1.6}
        .landing-alert-banner{max-width:700px;margin:0 auto 24px;padding:0 24px}
        .landing-alert-box{padding:14px 18px;background:var(--orange-bg);border:2px solid var(--orange-bdr);border-radius:var(--r);text-align:center;animation:pulse 3s ease infinite}
        .landing-alert-text{font-size:14px;font-weight:700;color:var(--orange)}
        .landing-features{max-width:700px;margin:0 auto 32px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .landing-feature{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);transition:var(--t)}
        .landing-feature:hover{border-color:var(--blue);transform:translateX(4px)}
        .landing-feature span{font-size:18px}
        .landing-feature p{font-size:13px;color:var(--text);font-weight:500}
        .landing-about{max-width:700px;margin:0 auto 32px;padding:0 24px}
        .landing-about-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--rl);padding:28px}
        .landing-about-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:16px;text-align:center}
        .landing-about-text{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:16px}
        .landing-about-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
        .landing-about-list li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text)}
        .landing-about-list li span{color:var(--green);font-weight:700}
        .landing-about-mission{font-size:13px;color:var(--text3);line-height:1.8;text-align:center;font-style:italic;border-top:1px solid var(--bg4);padding-top:16px}
        .landing-about-slogan{text-align:center;margin-top:16px;font-size:16px;font-weight:800;color:var(--blue)}
        .landing-cta{max-width:700px;margin:0 auto;padding:0 24px 60px;text-align:center}
        .landing-free{padding:14px 20px;background:var(--yellow-bg);border:1px solid var(--yellow-bdr);border-radius:var(--r);margin-bottom:20px;display:inline-block}
        .landing-free-text{font-size:18px;font-weight:800;color:var(--yellow)}
        .landing-shopier{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:var(--r);margin-bottom:24px;font-size:13px;font-weight:600;color:var(--green);max-width:300px;margin-left:auto;margin-right:auto}
        .landing-shopier span{font-size:18px}
        .landing-btn{display:inline-block;padding:16px 52px;background:var(--blue);color:#fff;border:none;border-radius:var(--r);font-size:18px;font-weight:800;cursor:pointer;transition:var(--t);font-family:inherit;animation:glow 2s ease infinite;text-decoration:none}
        .landing-btn:hover{background:var(--blue-hover);transform:translateY(-2px)}
        .landing-price{margin-top:20px;font-size:14px;color:var(--text3)}
        .landing-price strong{color:var(--text);font-size:24px;font-weight:900}
        /* AUTH */
        .auth{display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0e17,#111827,#0d1b2a);padding:20px}
        .auth.active{display:flex}
        .auth-box{width:100%;max-width:440px}
        .auth-logo{text-align:center;margin-bottom:32px}
        .auth-logo .whale{font-size:56px;display:block;animation:swim 3s ease infinite}
        .auth-logo h1{color:#fff;font-size:26px;font-weight:800}
        .auth-logo p{color:var(--text3);font-size:13px;margin-top:4px}
        .auth-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--rl);padding:32px;animation:fadeIn .5s ease}
        .auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--rs);padding:4px;margin-bottom:24px}
        .auth-tab{flex:1;padding:10px;text-align:center;border:none;background:0 0;color:var(--text3);font-weight:600;font-size:12px;cursor:pointer;border-radius:6px;transition:var(--t);font-family:inherit}
        .auth-tab.active{background:var(--bg3);color:var(--text);box-shadow:var(--shadow)}
        .auth-form{display:none}.auth-form.active{display:block;animation:fadeIn .3s}
        .auth-back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text3);cursor:pointer;text-decoration:none}
        .auth-back:hover{color:var(--blue)}
        .fg{margin-bottom:16px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
        .fg input{width:100%;padding:11px 14px;border:2px solid var(--bg4);border-radius:var(--rs);font-size:14px;font-family:inherit;transition:var(--t);outline:0;color:var(--text);background:var(--bg)}
        .fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
        .fg input::placeholder{color:var(--text3)}
        .btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;transition:var(--t);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-hover);transform:translateY(-1px)}
        .btn-outline{background:0 0;color:var(--blue);border:2px solid var(--blue)}.btn-outline:hover{background:var(--blue);color:#fff}
        .btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#059669}
        .btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#dc2626}
        .btn-sm{padding:7px 14px;font-size:12px}
        .pricing-box{margin-top:20px;padding-top:16px;border-top:1px solid var(--bg4)}
        .pricing-card{background:linear-gradient(135deg,var(--bg),var(--bg3));border:1px solid var(--bg4);border-radius:var(--r);padding:20px;color:#fff}
        .pricing-badge{display:inline-block;background:var(--blue);padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:10px}
        .pricing-price{font-size:32px;font-weight:900}.pricing-price span{font-size:14px;font-weight:400;opacity:.6}
        .pricing-list{list-style:none;margin-top:12px}.pricing-list li{padding:5px 0;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text2)}
        .pricing-list li::before{content:'\2713';width:18px;height:18px;background:rgba(16,185,129,.2);color:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
        .free-badge{display:block;text-align:center;margin-top:14px;padding:8px;background:rgba(245,158,11,.15);border:1px solid var(--yellow-bdr);border-radius:var(--rs);color:var(--yellow);font-size:12px;font-weight:600}
        .shopier-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:var(--rs);margin-top:12px;font-size:12px;font-weight:600;color:var(--green)}
        .shopier-badge span{font-size:16px}
        /* DASHBOARD */
        .dash{display:none;min-height:100vh}.dash.active{display:block}
        .nav{background:var(--bg3);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bg4)}
        .nav-left{display:flex;align-items:center;gap:10px}.nav-left span{font-size:22px}
        .nav-title{color:#fff;font-size:16px;font-weight:700}.nav-sub{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:1px}
        .nav-right{display:flex;align-items:center;gap:12px}
        .nav-status{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--bg4);border-radius:16px;font-size:11px;color:var(--text2)}
        .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite}
        .nav-timer{color:var(--text3);font-size:12px;font-weight:500}
        .nav-timer.urgent{color:var(--yellow);animation:pulse 1s ease infinite}
        .nav-timer.expired{color:var(--red)}
        .nav-user{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--bg4);border-radius:var(--rs);cursor:pointer;transition:var(--t)}
        .nav-user:hover{background:var(--bg2)}
        .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
        .u-name{color:#fff;font-size:12px;font-weight:600}.u-email{color:var(--text3);font-size:10px}
        .main{padding:24px;max-width:1400px;margin:0 auto}
        .alert-banner{padding:10px 20px;background:var(--orange-bg);border:1px solid var(--orange-bdr);border-radius:var(--r);margin-bottom:16px;text-align:center}
        .alert-banner-text{font-size:13px;font-weight:700;color:var(--orange)}
        .audio-hint{text-align:center;margin-bottom:16px;padding:12px;background:var(--yellow-bg);border:1px solid var(--yellow-bdr);border-radius:10px;color:var(--yellow);font-size:13px;cursor:pointer}
        .test-btn{text-align:center;margin-bottom:20px}.test-btn button{padding:14px 30px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:var(--t)}.test-btn button:hover{background:var(--blue-hover)}
        .notif-section{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:24px;margin-bottom:24px;animation:fadeIn .4s}
        .notif-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .notif-title-main{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff}
        .notif-list{max-height:300px;overflow-y:auto}
        .notif-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:var(--rs);margin-bottom:6px}
        .notif-item.al{background:var(--green-bg);border-left:3px solid var(--green)}.notif-item.as{background:var(--red-bg);border-left:3px solid var(--red)}
        .notif-title{font-size:12px;font-weight:700}.notif-item.al .notif-title{color:var(--green)}.notif-item.as .notif-title{color:var(--red)}
        .notif-time{font-size:10px;color:var(--text3)}
        .no-notif{text-align:center;padding:30px;color:var(--text3);font-size:13px}
        .cb-blue{background:rgba(59,130,246,.15);color:var(--blue);padding:3px 10px;border-radius:16px;font-size:10px;font-weight:600}
        .panels{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
        .panel{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--rl);overflow:hidden;animation:fadeIn .5s;transition:var(--t)}
        .panel-head{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bg4)}
        .panel-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;color:#fff}
        .panel-badge{padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;text-transform:uppercase}
        .badge-wait{background:var(--yellow-bg);color:var(--yellow)}
        .panel-status{padding:40px 20px;text-align:center;transition:var(--t);position:relative}
        .panel-status::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;transition:var(--t)}
        .panel-status.waiting{background:rgba(255,255,255,.02)}
        .panel-status.long{background:var(--green-bg)}.panel-status.long::before{background:linear-gradient(90deg,var(--green),#34d399)}
        .panel-status.short{background:var(--red-bg)}.panel-status.short::before{background:linear-gradient(90deg,var(--red),#f87171)}
        .panel-emoji{font-size:56px;display:block;margin-bottom:12px;animation:swim 3s ease infinite}
        .panel-status.long .panel-emoji,.panel-status.short .panel-emoji{animation:pulse 1.5s ease infinite}
        .panel-signal{font-size:22px;font-weight:800;margin-bottom:6px}
        .panel-status.long .panel-signal{color:var(--green)}.panel-status.short .panel-signal{color:var(--red)}
        .panel-desc{font-size:13px;color:var(--text2)}
        .panel-footer{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bg4)}
        .panel-time{font-size:11px;color:var(--text3)}.panel-whales{font-size:12px;font-weight:600;color:var(--text2)}
        .legend{display:flex;gap:16px;padding:12px 24px;border-top:1px solid var(--bg4)}
        .leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}.leg-dot{width:7px;height:7px;border-radius:50%}
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;animation:fadeIn .4s}
        .stat{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:18px;text-align:center}
        .stat-icon{font-size:24px;margin-bottom:6px}.stat-val{font-size:22px;font-weight:800;color:var(--text)}.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
        .bottom{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
        .card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--r);padding:24px;animation:fadeIn .5s}
        .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
        .card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;color:#fff}
        .card-badge{padding:3px 10px;border-radius:16px;font-size:10px;font-weight:600}
        .cb-green{background:var(--green-bg);color:var(--green)}
        .webhook-box{background:var(--bg);border:2px solid var(--bg4);border-radius:var(--rs);padding:12px 14px;display:flex;align-items:center;gap:8px;font-family:monospace;font-size:12px;word-break:break-all;margin-bottom:14px;color:var(--text2)}
        .copy-btn{background:var(--blue);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--t);font-family:inherit}
        .copy-btn:hover{background:var(--blue-hover)}.copy-btn.copied{background:var(--green)}
        .steps{list-style:none;counter-reset:step}.steps li{counter-increment:step;padding:10px 0;border-bottom:1px solid var(--bg4);display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--text2)}.steps li:last-child{border-bottom:0}
        .steps li::before{content:counter(step);display:flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--blue);color:#fff;border-radius:50%;font-size:10px;font-weight:700;flex-shrink:0}
        .code{background:var(--bg);border:1px solid var(--bg4);border-radius:var(--rs);padding:12px;margin-top:10px;font-family:monospace;font-size:11px;color:#a5f3fc;white-space:pre;line-height:1.5;overflow-x:auto}
        .admin-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;background:rgba(245,158,11,.15);color:var(--yellow);text-transform:uppercase;margin-bottom:12px}
        .sg{margin-bottom:16px}.sg-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
        .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg4)}.toggle-row:last-child{border-bottom:0}
        .toggle-label{font-size:13px;color:var(--text)}.toggle-desc{font-size:11px;color:var(--text3);margin-top:1px}
        .toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}.toggle-switch input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg4);border-radius:24px;transition:var(--t)}
        .toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--t)}
        .toggle-switch input:checked+.toggle-slider{background:var(--blue)}.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
        .sub-card{background:linear-gradient(135deg,var(--bg),var(--bg3));border:1px solid var(--bg4);border-radius:var(--r);padding:20px;color:#fff}
        .sub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
        .sub-badge{padding:3px 10px;border-radius:16px;font-size:10px;font-weight:700;text-transform:uppercase}
        .sub-badge.trial{background:rgba(245,158,11,.2);color:var(--yellow)}.sub-badge.active{background:rgba(16,185,129,.2);color:var(--green)}

        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}

        .modal-footer{display:flex;gap:10px;margin-top:18px}.modal-footer .btn{flex:1}

        .ap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .ap-title{font-size:14px;font-weight:800}.alert-popup.al .ap-title{color:var(--green)}.alert-popup.as .ap-title{color:var(--red)}
        .ap-close{background:0 0;border:none;font-size:16px;cursor:pointer;color:var(--text3);padding:2px}
        .ap-body{font-size:13px;color:var(--text)}.ap-time{font-size:11px;color:var(--text3);margin-top:6px}
        .legal-text{font-size:13px;color:var(--text);line-height:1.8}.legal-text p{margin-bottom:10px}
        .legal-warn{margin-bottom:12px;padding:10px;background:rgba(245,158,11,.15);border:1px solid var(--yellow-bdr);border-radius:8px;font-weight:700;color:var(--yellow);text-align:center}
        .legal-box{padding:10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text3);text-align:center}
        .err-msg{background:var(--red-bg);border:1px solid rgba(239,68,68,.3);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--red);text-align:center;display:none}
        .err-msg.show{display:block;animation:fadeIn .3s}
        /* PLAN KARTLARI */
        .plans-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}

        .plan-card:hover{border-color:var(--blue);transform:translateY(-2px)}

        .reviews-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

        .review-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
        .review-name{font-size:13px;font-weight:700;color:#fff}
        .review-stars{color:var(--yellow);font-size:12px}

        .review-delete{background:0 0;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:2px 6px}
        .review-form{margin-top:16px;padding-top:16px;border-top:1px solid var(--bg4)}

        .review-submit{margin-top:10px}
        /* CHAT */
        .chat-toggle{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;cursor:pointer;z-index:900;box-shadow:0 4px 12px rgba(59,130,246,.4);transition:var(--t)}
        .chat-toggle:hover{background:var(--blue-hover);transform:scale(1.1)}
        .chat-panel{position:fixed;bottom:90px;right:24px;width:350px;max-height:500px;background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--rl);z-index:900;display:none;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeIn .3s}

        .chat-input:focus{border-color:var(--blue)}

        .chat-send:hover{background:var(--blue-hover)}
        .chat-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}

        .faq-item{border:1px solid var(--bg4);border-radius:var(--rs);margin-bottom:8px;overflow:hidden}

        .faq-arrow{transition:var(--t);font-size:12px}
        .faq-item.open .faq-arrow{transform:rotate(180deg)}

        .faq-item.open .faq-answer{max-height:300px;padding:0 16px 14px}

        .privacy-text{font-size:13px;color:var(--text2);line-height:1.8}.privacy-text h3{color:#fff;font-size:15px;margin:16px 0 8px}.privacy-text p{margin-bottom:10px}
        .privacy-text ul{padding-left:20px;margin-bottom:10px}

<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-whale">🐋</div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
    <div class="loading-text">Balina Alarm yükleniyor...</div>
</div>

<div class="flash-bar" id="flashBar"></div>
<script>
var ADMIN_EMAIL = "orkun159064@outlook.com";
var S = { user: null, subscribed: false, trialStart: null, trialDur: 8*60*60*1000, soundOn: true, notifOn: true, signalCount: 0, whaleBase: 0, active: false, isAdmin: false };
var selectedStars = 5;
var currentReplyEmail = '';

// ===== LOADING =====
window.addEventListener('load', function() {
    setTimeout(function() {
        document.getElementById('loadingScreen').classList.add('hide');
    }, 2000);
});

// ===== BALINA & ONLINE =====
function getDailyWhales() { var t=new Date();var s=t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();var h=0;for(var i=0;i<String(s).length;i++){h=((h<<5)-h)+String(s).charCodeAt(i);h|=0;}return 9000+Math.abs(h)%801; }
function updateWhales() { if(S.whaleBase===0)S.whaleBase=getDailyWhales();document.getElementById('statWhales').textContent=S.whaleBase.toLocaleString('tr-TR');document.getElementById('whalesXAU').textContent='🐋 '+S.whaleBase.toLocaleString('tr-TR')+' balina izleniyor';document.getElementById('whalesBTC').textContent='🐋 '+S.whaleBase.toLocaleString('tr-TR')+' balina izleniyor'; }
function updateOnlineCount() { var base=4000+Math.floor(Math.random()*3001);var el=document.getElementById('onlineCount');if(el)el.textContent=base.toLocaleString('tr-TR'); }
updateOnlineCount();setInterval(updateOnlineCount,15*60*1000);

function timeAgo(ds) { var d=new Date(ds);var h=String(d.getHours()).padStart(2,'0');var m=String(d.getMinutes()).padStart(2,'0');return h+':'+m+' de geldi'; }

// ===== HATA GÖSTERME =====
function showAuthError(msg) { var el=document.getElementById('authError');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},5000); }
function hideAuthError() { document.getElementById('authError').classList.remove('show'); }

// ===== LANDING / AUTH =====
function showAuth() { hideAuthError();document.getElementById('landingPage').style.display='none';document.getElementById('authScreen').classList.add('active'); }
function showLanding() { document.getElementById('authScreen').classList.remove('active');document.getElementById('landingPage').style.display='block'; }

function switchTab(t) {
    hideAuthError();
    document.querySelectorAll('.auth-tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active');});
    if(t==='login'){document.querySelectorAll('.auth-tab')[0].classList.add('active');document.getElementById('loginForm').classList.add('active');}
    else if(t==='register'){document.querySelectorAll('.auth-tab')[1].classList.add('active');document.getElementById('registerForm').classList.add('active');}
    else{document.querySelectorAll('.auth-tab')[2].classList.add('active');document.getElementById('resetForm').classList.add('active');}
}

// ===== GİRİŞ =====
function doLogin(e) {
    e.preventDefault();hideAuthError();
    var email=document.getElementById('lEmail').value.trim();var pass=document.getElementById('lPass').value;
    if(!email||!pass){showAuthError('E-posta ve şifre gerekli!');return;}
    fetch('/api/check-trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
    .then(function(r){return r.json();})
    .then(function(data){
        var users=JSON.parse(localStorage.getItem('ba_users')||'[]');
        var u=users.find(function(x){return x.email===email&&x.pass===pass;});
        if(!u){showAuthError('E-posta veya şifre hatalı!');return;}
        if(!data.allowed&&!data.subscribed){showAuthError('Deneme süreniz dolmuştur.');return;}
        S.user=u;S.subscribed=u.sub||data.subscribed||false;S.trialStart=data.start||u.trialStart||Date.now();S.isAdmin=(u.email===ADMIN_EMAIL);
        save();goDash();
    }).catch(function(){showAuthError('Sunucuya bağlanılamıyor.');});
}

// ===== KAYIT =====
function doRegister(e) {
    e.preventDefault();hideAuthError();
    var name=document.getElementById('rName').value.trim();var email=document.getElementById('rEmail').value.trim();var pass=document.getElementById('rPass').value;var phone=document.getElementById('rPhone').value.replace(/\s/g,'');
    if(!name||!email||!pass||!phone){showAuthError('Tüm alanları doldurun!');return;}
    if(phone.length<10){showAuthError('Geçerli bir telefon numarası girin!');return;}
    if(pass.length<6){showAuthError('Şifre en az 6 karakter olmalı!');return;}
    if(!document.getElementById('kvkkCheck').checked){showAuthError('Gizlilik sözleşmesini kabul etmelisiniz!');return;}

    fetch('/api/check-phone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone})})
    .then(function(r){return r.json();})
    .then(function(data){
        if(!data.available){showAuthError(data.message||'Bu telefon numarası zaten kayıtlı!');return;}
        return fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone,email:email,name:name,pass:pass})})
        .then(function(r){return r.json();})
        .then(function(regData){
            if(!regData.success){showAuthError(regData.message||'Kayıt başarısız!');return;}
            var users=JSON.parse(localStorage.getItem('ba_users')||'[]');
            var n={name:name,email:email,pass:pass,phone:phone,sub:false,trialStart:Date.now()};
            users.push(n);localStorage.setItem('ba_users',JSON.stringify(users));
            S.user=n;S.trialStart=n.trialStart;S.isAdmin=(email===ADMIN_EMAIL);
            save();goDash();
        });
    }).catch(function(){showAuthError('Bağlantı hatası.');});
}

// ===== ŞİFRE SIFIRLAMA =====
function doReset(e) {
    e.preventDefault();hideAuthError();
    var email=document.getElementById('resetEmail').value.trim();var phone=document.getElementById('resetPhone').value.replace(/\s/g,'');var newPass=document.getElementById('resetPass').value;
    if(!email||!phone||!newPass){showAuthError('Tüm alanları doldurun!');return;}
    fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,phone:phone,newPass:newPass})})
    .then(function(r){return r.json();})
    .then(function(data){
        if(data.success){
            var users=JSON.parse(localStorage.getItem('ba_users')||'[]');var u=users.find(function(x){return x.email===email;});
            if(u){u.pass=newPass;localStorage.setItem('ba_users',JSON.stringify(users));}
            alert('✅ Şifreniz sıfırlandı! Şimdi giriş yapabilirsiniz.');switchTab('login');
        }else{showAuthError(data.message||'Sıfırlama başarısız!');}
    }).catch(function(){showAuthError('Bağlantı hatası.');});
}

function doLogout(){localStorage.removeItem('ba_session');location.reload();}
function save(){localStorage.setItem('ba_session',JSON.stringify({user:S.user,sub:S.subscribed,trialStart:S.trialStart}));}

// ===== ADMIN OTO GİRİŞ =====
function adminAutoLogin(){
    return fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:ADMIN_EMAIL})})
    .then(function(r){return r.json();})
    .then(function(data){if(data.success){S.user=data.user;S.subscribed=true;S.isAdmin=true;S.trialStart=Date.now();save();return true;}return false;})
    .catch(function(){return false;});
}

function checkTrialAndGo(){
    fetch('/api/check-trial',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:S.user?S.user.email:''})})
    .then(function(r){return r.json();})
    .then(function(data){if(data.allowed){S.trialStart=data.start;if(data.subscribed)S.subscribed=true;goDash();}else{showAuthError(data.message||'Deneme süreniz dolmuştur.');localStorage.removeItem('ba_session');}})
    .catch(function(){showAuthError('Sunucuya bağlanılamıyor.');});
}

function checkExistingTrial(){
    return fetch('/api/trial-status').then(function(r){return r.json();}).then(function(data){
        if(data.exists){if(data.expired&&!data.subscribed)return false;S.trialStart=data.start;if(data.subscribed)S.subscribed=true;if(data.isAdmin)S.isAdmin=true;return true;}
        return true;
    }).catch(function(){if(S.trialStart&&(Date.now()-S.trialStart>=S.trialDur))return false;return true;});
}

// ===== GO DASHBOARD =====
function updateUserUI(){
    if(!S.user)return;
    var navName=document.getElementById('navName');if(navName)navName.textContent=S.user.name;
    var navEmail=document.getElementById('navEmail');if(navEmail)navEmail.textContent=S.user.email;
    var navAvatar=document.getElementById('navAvatar');if(navAvatar)navAvatar.textContent=S.user.name[0].toUpperCase();
    var mName=document.getElementById('mName');if(mName)mName.textContent=S.user.name;
    var mEmail=document.getElementById('mEmail');if(mEmail)mEmail.textContent=S.user.email;
    var mAvatar=document.getElementById('mAvatar');if(mAvatar)mAvatar.textContent=S.user.name[0].toUpperCase();
    var mAdmin=document.getElementById('mAdminBadge');if(mAdmin)mAdmin.style.display=S.isAdmin?'block':'none';
    var subBadge=document.getElementById('subBadge');
    var mSub=document.getElementById('mSub');
    var subLabel=document.getElementById('subLabel');
    var subBtn=document.getElementById('subBtn');
    var upgradeBtn=document.getElementById('upgradeBtn');
    var reviewForm=document.getElementById('reviewForm');
    if(S.subscribed||S.isAdmin){
        if(subBadge){subBadge.textContent=S.isAdmin?'Admin':'Aktif';subBadge.className='sub-badge active';}
        if(mSub){mSub.textContent=S.isAdmin?'Admin Hesap':'Aktif Abonelik';mSub.style.color='var(--green)';}
        if(subLabel)subLabel.textContent=S.isAdmin?'Admin erişimi':'Abonelik süreniz';
        if(subBtn)subBtn.style.display='none';
        if(upgradeBtn)upgradeBtn.style.display='none';
        if(reviewForm)reviewForm.style.display='block';
    }else{
        if(subBadge){subBadge.textContent='Deneme';subBadge.className='sub-badge trial';}
        if(mSub){mSub.textContent='Ücretsiz Deneme';mSub.style.color='var(--yellow)';}
        if(subLabel)subLabel.textContent='Ücretsiz deneme süresi';
        if(subBtn)subBtn.style.display='block';
        if(upgradeBtn)upgradeBtn.style.display='block';
    }
}

function updateUserUI(){
    if(!S.user)return;
    document.getElementById('navName').textContent=S.user.name;document.getElementById('navEmail').textContent=S.user.email;
    document.getElementById('navAvatar').textContent=S.user.name[0].toUpperCase();
    document.getElementById('mName').textContent=S.user.name;document.getElementById('mEmail').textContent=S.user.email;
    document.getElementById('mAvatar').textContent=S.user.name[0].toUpperCase();
    document.getElementById('mAdminBadge').style.display=S.isAdmin?'block':'none';
    if(S.subscribed||S.isAdmin){
        document.getElementById('subBadge').textContent=S.isAdmin?'Admin':'Aktif';document.getElementById('subBadge').className='sub-badge active';
        document.getElementById('mSub').textContent=S.isAdmin?'Admin Hesap':'Aktif Abonelik';document.getElementById('mSub').style.color='var(--green)';
        document.getElementById('subLabel').textContent=S.isAdmin?'Admin erişimi':'Abonelik süreniz';
        document.getElementById('subBtn').style.display='none';document.getElementById('upgradeBtn').style.display='none';
        document.getElementById('reviewForm').style.display='block';
    }else{
        document.getElementById('subBadge').textContent='Deneme';document.getElementById('subBadge').className='sub-badge trial';
        document.getElementById('mSub').textContent='Ücretsiz Deneme';document.getElementById('mSub').style.color='var(--yellow)';
        document.getElementById('subLabel').textContent='Ücretsiz deneme süresi';
        document.getElementById('subBtn').style.display='block';document.getElementById('upgradeBtn').style.display='block';
    }
}

function startTimer(){

function processSignal(symbol,type){
    if(!S.active)return;if(!S.isAdmin&&!S.subscribed&&(Date.now()-S.trialStart)>=S.trialDur)return;
    var now=new Date();var isXAU=symbol.toUpperCase().includes('XAU')||symbol.toUpperCase().includes('ALTIN');var pair=isXAU?'XAUUSD':'BTCUSDT';var isBuy=(type==='buy'||type==='long');
    addLastSignal({symbol:pair,action:type,time:now.toISOString()});
    applyPanel(pair,type,now.toISOString());

}

// ===== SSE =====
function connectToServer(){
    var evtSource=new EventSource("/events");
    evtSource.onopen=function(){console.log("✅ Sunucuya bağlanıldı");};
    evtSource.onmessage=function(event){
        try{var data=JSON.parse(event.data);
            if(data.type==="init"&&data.signals&&data.signals.length){var allSignals=data.signals.slice(0,10);for(var i=0;i<allSignals.length;i++){addLastSignal(allSignals[i]);}var latestXAU=null,latestBTC=null;for(var i=0;i<allSignals.length;i++){var sym=allSignals[i].symbol.toUpperCase();if(sym.includes('XAU')&&!latestXAU)latestXAU=allSignals[i];if(sym.includes('BTC')&&!latestBTC)latestBTC=allSignals[i];}if(latestXAU){applyPanel('XAUUSD',latestXAU.action,latestXAU.time);try{localStorage.setItem('ba_panel_XAUUSD',JSON.stringify({action:latestXAU.action,time:latestXAU.time}));}catch(e){}}if(latestBTC){applyPanel('BTCUSDT',latestBTC.action,latestBTC.time);try{localStorage.setItem('ba_panel_BTCUSDT',JSON.stringify({action:latestBTC.action,time:latestBTC.time}));}catch(e){}}}
            if(data.type==="new_signal"&&data.signal){console.log("🔔 Yeni sinyal:",data.signal.symbol,data.signal.action);processSignal(data.signal.symbol,data.signal.action);}
        }catch(e){console.log("SSE parse hatası:",e);}
    };
    evtSource.onerror=function(){console.log("❌ Bağlantı kesildi");evtSource.close();setTimeout(connectToServer,5000);};
}
